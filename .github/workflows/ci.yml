name: Lightweight project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lightweight dependency check
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
